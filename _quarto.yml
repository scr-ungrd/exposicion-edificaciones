project:
  type: book
  output-dir: _book

book:
  title: "Exposición de edificaciones sismo de San José del Palmar"
  date: "2026-08-14"

  downloads: [pdf]
  site-url: https://scr-ungrd.github.io/exposicion-edificaciones
  favicon: media/favicon.png
  sidebar:
    tools:
      - icon: diagram-3-fill
        href: "https://scr-ungrd.github.io/hub/"
        aria-label: "HUB SCR"
        target: _blank
        rel: noopener noreferrer
      - icon: github
        href: "https://github.com/scr-ungrd/exposicion-edificaciones"
        aria-label: "Repositorio en GitHub"
        target: _blank
        rel: noopener noreferrer
      - icon: translate
        href: "https://translate.google.com/translate?sl=es&tl=en&u=https://scr-ungrd.github.io/exposicion-edificaciones/"
        aria-label: "Translate to English"
        target: _blank
        rel: noopener noreferrer
    style: floating
    collapse-level: 1
  chapters:
    - index.qmd
    - Pagina-legal.qmd
    - text: "Presentación"
      href: presentacion.qmd
    - text: "1. Metodología"
      href: 01-metodologia.qmd
    - text: "2. Mapa de exposición de edificaciones"
      href: 02-mapa-exposicion.qmd
    - 03-referencias-bibliograficas.qmd

lang: es

bibliography: references.bib
csl: apa.csl
link-citations: true
nocite: |
  @*

crossref:
  fig-prefix: "Figura"
  tbl-prefix: "Tabla"
  chapters: true

format:
  html:
    theme: cosmo
    toc: true
    number-sections: false
    reference-location: block
    logo: "media/UNGRD-Horizontal.png"
    css:
      - custom.css
    include-in-header:
      - caption-bold.html
      - text: |
          <meta name="citation_book_title" content="Exposición de edificaciones en Colombia">
          <meta name="citation_publisher" content="Unidad Nacional para la Gestión del Riesgo de Desastres - UNGRD">
          <meta name="citation_publication_date" content="2026/08/14">
          <meta name="citation_online_date" content="2026/08/14">
          <meta name="citation_language" content="es">
          <meta name="citation_pdf_url" content="https://scr-ungrd.github.io/exposicion-edificaciones/Exposicion_de_edificaciones_en_Colombia.pdf">
          <meta name="robots" content="index, follow">
    html-math-method: katex
